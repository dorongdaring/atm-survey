<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NH Senior Training Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; }
    .select-none { user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ children, size = 40, className = '' }) => (
      <span className={className} style={{ fontSize: size, lineHeight: 1 }}>{children}</span>
    );

    const App = () => {
      const [step, setStep] = useState('HOME'); 
      const [service, setService] = useState(null); 
      const [inputVal, setInputVal] = useState('');
      const [targetBank, setTargetBank] = useState('');
      const [history, setHistory] = useState(['HOME']);
      const [msg, setMsg] = useState('거래를 시작해 주세요.');
      const [autoCountAmount] = useState(50000);

      const BANKS = ['NH농협', '신한은행', '국민은행', '우리은행', '하나은행', '우체국'];

      const formatAccountNumber = (val) => {
        if (!val) return '0';
        let res = '';
        for (let i = 0; i < val.length; i++) {
          if (i === 3 || i === 9 || i === 11) res += '-';
          res += val[i];
        }
        return res;
      };

      const formatAmount = (val) => {
        if (!val) return '0';
        return Number(val).toLocaleString();
      };

      const updateMessage = (currentStep, currentService) => {
        switch (currentStep) {
          case 'HOME': setMsg('거래를 시작하시려면 화면을 터치해 주세요.'); break;
          case 'SERVICE_SELECT': setMsg('원하시는 거래 버튼을 눌러 주세요.'); break;
          case 'PIN_INPUT': setMsg('비밀번호 4자리를 입력해 주십시오.'); break;
          case 'CASH_INSERT': setMsg('현금을 투입구에 가지런히 넣어주세요.'); break;
          case 'CASH_COUNT': setMsg('현금을 확인하고 있습니다. 잠시만 기다려 주세요.'); break;
          case 'AMOUNT_CONFIRM': setMsg('투입하신 금액이 맞는지 확인해 주세요.'); break;
          case 'PASSBOOK_INSERT': setMsg('통장의 마지막 페이지를 펴서 넣어주세요.'); break;
          case 'PASSBOOK_PRINTING': setMsg('통장을 정리하고 있습니다.'); break;
          case 'AMOUNT_INPUT': setMsg('금액을 만원 단위로 입력해 주세요.'); break;
          case 'ACCOUNT_INPUT': setMsg('계좌번호 12자리를 입력해 주세요.'); break;
          case 'BANK_SELECT': setMsg('돈을 보내실 은행을 선택해 주세요.'); break;
          case 'CONFIRM': setMsg('입력하신 내용이 맞는지 확인해 주세요.'); break;
          case 'PROCESSING': setMsg('거래를 처리 중입니다. 잠시만 기다려 주세요.'); break;
          case 'SUCCESS': 
            if (currentService === 'PASSBOOK') setMsg('통장 정리가 종료되었습니다.');
            else setMsg('거래가 성공적으로 완료되었습니다.');
            break;
          default: setMsg('안내에 따라 진행해 주세요.');
        }
      };

      const navigateTo = (nextStep, serviceType = null) => {
        const nextService = serviceType || service;
        setHistory(prev => [...prev, nextStep]);
        setStep(nextStep);
        if (serviceType) setService(serviceType);
        updateMessage(nextStep, nextService);
      };

      const goBack = () => {
        if (history.length > 1) {
          const newHistory = [...history];
          newHistory.pop();
          const prevStep = newHistory[newHistory.length - 1];
          setHistory(newHistory);
          setStep(prevStep);
          updateMessage(prevStep, service);
          setInputVal(''); 
        }
      };

      const resetHome = () => {
        setStep('HOME');
        setHistory(['HOME']);
        setInputVal('');
        setService(null);
        setTargetBank('');
        updateMessage('HOME', null);
      };

      const addDigit = (digit) => {
        if (step === 'PIN_INPUT' && inputVal.length < 4) setInputVal(inputVal + digit);
        if (step === 'ACCOUNT_INPUT' && inputVal.length < 12) setInputVal(inputVal + digit);
        if (step === 'AMOUNT_INPUT' && inputVal.length < 10) setInputVal(inputVal + digit);
      };

      const clearDigit = () => setInputVal(inputVal.slice(0, -1));

      useEffect(() => {
        if (step === 'CASH_COUNT') {
          const timer = setTimeout(() => {
            setStep('AMOUNT_CONFIRM');
            updateMessage('AMOUNT_CONFIRM', service);
          }, 2000);
          return () => clearTimeout(timer);
        }
        if (step === 'PASSBOOK_PRINTING') {
          const timer = setTimeout(() => {
            setStep('SUCCESS');
            updateMessage('SUCCESS', service);
          }, 3500);
          return () => clearTimeout(timer);
        }
        if (step === 'PROCESSING') {
          const timer = setTimeout(() => {
            setStep('SUCCESS');
            updateMessage('SUCCESS', service);
          }, 2500);
          return () => clearTimeout(timer);
        }
      }, [step, service]);

      const Keypad = () => (
        <div className="grid grid-cols-3 gap-2 w-full max-w-[340px] mx-auto">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9, '초기화', 0, '삭제'].map((k) => (
            <button
              key={k}
              onClick={() => {
                if (k === '삭제') clearDigit();
                else if (k === '초기화') setInputVal('');
                else addDigit(k.toString());
              }}
              className={`h-16 text-3xl font-black rounded-xl shadow active:bg-blue-100 transition-colors border-2 ${
                typeof k === 'number' ? 'bg-white text-slate-800 border-slate-200' : 'bg-slate-100 text-slate-600 border-slate-300'
              }`}
            >
              {k}
            </button>
          ))}
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-1 font-sans select-none">
          <div className="w-full max-w-md bg-white rounded-[30px] shadow-2xl overflow-hidden border-[8px] border-slate-400 h-[850px] flex flex-col relative">
            <div className="bg-[#002b5c] p-4 text-white flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="bg-white px-2 py-1 rounded text-[#002b5c] font-black text-sm">NH</div>
                <span className="text-xl font-extrabold">NH농협은행</span>
              </div>
              <div className="flex items-center gap-1 text-sm font-bold text-yellow-400">
                ☎ 도움말: 1588-2100
              </div>
            </div>

            <div className="bg-blue-50 p-6 border-b-2 border-blue-100 text-center">
              <h2 className="text-2xl font-black text-slate-800 break-keep min-h-[64px] flex items-center justify-center leading-tight">
                {msg}
              </h2>
            </div>

            <div className="flex-grow p-4 flex flex-col bg-[#f0f4f8] overflow-hidden">
              {step === 'HOME' && (
                <div className="h-full flex flex-col items-center justify-center cursor-pointer space-y-6" onClick={() => navigateTo('SERVICE_SELECT')}>
                  <div className="text-blue-900 animate-pulse bg-white p-8 rounded-full shadow-inner">
                    <Icon size={120}>💳</Icon>
                  </div>
                  <div className="text-center">
                    <h3 className="text-3xl font-black text-blue-900 mb-2">화면을 터치해 주세요</h3>
                  </div>
                  <div className="bg-yellow-400 px-10 py-4 rounded-full text-2xl font-black shadow-lg">시작하기</div>
                </div>
              )}

              {step === 'SERVICE_SELECT' && (
                <div className="grid grid-cols-2 gap-4 h-full py-2">
                  {[
                    { id: 'DEPOSIT', label: '현금 입금', sub: '카드 넣기', icon: '👛', color: 'bg-emerald-600' },
                    { id: 'WITHDRAW', label: '현금 출금', sub: '카드 넣기', icon: '🤲', color: 'bg-blue-700' },
                    { id: 'TRANSFER', label: '계좌 이체', sub: '카드 넣기', icon: '↔️', color: 'bg-orange-600' },
                    { id: 'PASSBOOK', label: '통장 정리', sub: null, icon: '📖', color: 'bg-purple-700' },
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => {
                        if (item.id === 'PASSBOOK') navigateTo('PASSBOOK_INSERT', item.id);
                        else if (item.id === 'TRANSFER') navigateTo('BANK_SELECT', item.id);
                        else navigateTo('PIN_INPUT', item.id);
                      }}
                      className={`${item.color} text-white p-4 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-md active:scale-95 transition-all`}
                    >
                      <Icon size={40}>{item.icon}</Icon>
                      <div className="flex flex-col items-center leading-tight">
                        <span className="text-2xl font-black">{item.label}</span>
                        {item.sub && <span className="text-sm font-bold opacity-80 mt-1">{item.sub}</span>}
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {step === 'PASSBOOK_INSERT' && (
                <div className="h-full flex flex-col items-center justify-center space-y-10">
                  <div className="relative w-72 h-48 bg-slate-200 border-x-4 border-t-4 border-slate-300 rounded-t-xl overflow-hidden shadow-inner">
                    <div className="absolute top-8 left-1/2 -translate-x-1/2 w-64 h-1 bg-slate-800 shadow-[0_0_10px_rgba(0,0,0,0.5)]"></div>
                    <div className="absolute -bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
                      <div className="w-56 h-40 bg-purple-100 border-2 border-purple-300 rounded shadow-md flex items-center justify-center">
                        <div className="w-full h-0.5 bg-purple-200 absolute top-1/2"></div>
                        <Icon size={60} className="text-purple-400">📖</Icon>
                      </div>
                    </div>
                  </div>
                  <div className="text-center px-4">
                    <p className="text-xl font-bold text-slate-600 mb-6 italic">마지막 인쇄된 페이지를 펴주세요.</p>
                    <button onClick={() => navigateTo('PASSBOOK_PRINTING')} className="bg-blue-900 text-white px-10 py-6 rounded-2xl text-2xl font-black shadow-xl active:scale-95">
                      통장을 넣었습니다
                    </button>
                  </div>
                </div>
              )}

              {step === 'PASSBOOK_PRINTING' && (
                <div className="h-full flex flex-col items-center justify-center space-y-8">
                  <div className="relative">
                    <div className="w-32 h-32 border-[12px] border-slate-100 border-t-purple-600 rounded-full animate-spin"></div>
                    <div className="absolute inset-0 flex items-center justify-center text-purple-600">
                      <Icon size={40}>🖨️</Icon>
                    </div>
                  </div>
                  <div className="text-center">
                    <h3 className="text-3xl font-black text-slate-800">통장을 정리합니다</h3>
                    <p className="text-lg text-slate-500 font-bold mt-2 font-mono">치익- 치익- (인쇄 중...)</p>
                  </div>
                </div>
              )}

              {step === 'BANK_SELECT' && (
                <div className="grid grid-cols-2 gap-3 h-full overflow-y-auto pr-1">
                  {BANKS.map((bank) => (
                    <button key={bank} onClick={() => { setTargetBank(bank); navigateTo('ACCOUNT_INPUT'); }} className="bg-white border-4 border-slate-200 p-5 rounded-2xl text-2xl font-black text-slate-700 active:border-blue-500 active:bg-blue-50 transition-all h-24">
                      {bank}
                    </button>
                  ))}
                </div>
              )}

              {step === 'PIN_INPUT' && (
                <div className="flex flex-col items-center justify-center h-full">
                  <div className="flex gap-4 mb-6">
                    {[1, 2, 3, 4].map((i) => (
                      <div key={i} className={`w-14 h-14 rounded-xl border-4 flex items-center justify-center text-3xl ${inputVal.length >= i ? 'bg-blue-900 border-blue-900 text-white' : 'bg-white border-slate-300'}`}>
                        {inputVal.length >= i ? '●' : ''}
                      </div>
                    ))}
                  </div>
                  <Keypad />
                  <button 
                    disabled={inputVal.length < 4}
                    onClick={() => {
                      setInputVal(''); 
                      if (service === 'DEPOSIT') navigateTo('CASH_INSERT');
                      else if (service === 'WITHDRAW') navigateTo('AMOUNT_INPUT');
                      else navigateTo('PROCESSING');
                    }}
                    className={`w-full max-w-[340px] mt-6 py-5 rounded-2xl text-3xl font-black shadow-lg transition-all ${inputVal.length < 4 ? 'bg-slate-300 text-slate-500' : 'bg-blue-900 text-white active:scale-95'}`}
                  >
                    확인
                  </button>
                </div>
              )}

              {step === 'CASH_INSERT' && (
                <div className="h-full flex flex-col items-center justify-center space-y-10">
                  <div className="relative w-64 h-40 bg-slate-800 rounded-t-lg border-x-8 border-t-8 border-slate-600">
                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-56 h-4 bg-blue-400 rounded-full animate-pulse shadow-[0_0_15px_rgba(96,165,250,0.8)]"></div>
                    <div className="absolute -bottom-16 left-1/2 -translate-x-1/2 animate-bounce">
                      <div className="w-48 h-24 bg-emerald-500 rounded border-2 border-emerald-700 flex items-center justify-center shadow-lg">
                        <span className="text-white font-black text-xl">현금 (만원권)</span>
                      </div>
                    </div>
                  </div>
                  <div className="text-center">
                    <p className="text-xl font-bold text-slate-600">투입구가 열렸습니다.</p>
                    <button onClick={() => navigateTo('CASH_COUNT')} className="mt-8 bg-blue-900 text-white px-10 py-5 rounded-2xl text-2xl font-black shadow-xl active:scale-95">
                      현금을 넣었습니다
                    </button>
                  </div>
                </div>
              )}

              {step === 'CASH_COUNT' && (
                <div className="h-full flex flex-col items-center justify-center space-y-8">
                  <div className="relative">
                    <div className="w-32 h-32 border-[12px] border-slate-100 border-t-emerald-500 rounded-full animate-spin"></div>
                    <div className="absolute inset-0 flex items-center justify-center text-emerald-600">
                      <Icon size={40}>🪙</Icon>
                    </div>
                  </div>
                  <div className="text-center">
                    <h3 className="text-3xl font-black text-slate-800">금액을 확인 중...</h3>
                    <p className="text-lg text-slate-500 font-bold mt-2 font-mono">드르륵... 드르륵...</p>
                  </div>
                </div>
              )}

              {step === 'AMOUNT_CONFIRM' && (
                <div className="h-full flex flex-col items-center justify-center">
                  <div className="w-full bg-white rounded-3xl p-8 shadow-inner border-2 border-emerald-100 space-y-6">
                    <h3 className="text-xl font-bold text-slate-400 text-center">인식된 금액</h3>
                    <div className="text-center border-y-2 py-6 border-slate-50">
                      <span className="text-5xl font-black text-emerald-600">{formatAmount(autoCountAmount)}</span>
                      <span className="text-2xl font-bold text-slate-400 ml-2">원</span>
                    </div>
                    <div className="flex justify-between text-lg font-bold text-slate-500 px-2">
                      <span>만원권</span>
                      <span>5 매</span>
                    </div>
                  </div>
                  <div className="w-full mt-10 space-y-4">
                    <button onClick={() => { setInputVal(autoCountAmount.toString()); navigateTo('PROCESSING'); }} className="w-full bg-blue-900 text-white py-6 rounded-2xl text-3xl font-black shadow-lg active:scale-95">
                      확인 (입력 완료)
                    </button>
                    <button onClick={() => navigateTo('CASH_INSERT')} className="w-full bg-slate-200 text-slate-700 py-4 rounded-2xl text-xl font-black">
                      다시 넣기 (반환)
                    </button>
                  </div>
                </div>
              )}

              {(step === 'ACCOUNT_INPUT' || step === 'AMOUNT_INPUT') && (
                <div className="flex flex-col items-center justify-center h-full">
                  <div className="w-full bg-white border-b-4 border-blue-900 p-4 text-center rounded-t-xl shadow-inner mb-3">
                    <span className={`${step === 'ACCOUNT_INPUT' ? 'text-3xl' : 'text-4xl'} font-black tracking-tighter text-blue-900`}>
                      {step === 'ACCOUNT_INPUT' ? formatAccountNumber(inputVal) : formatAmount(inputVal)}
                      <span className="text-xl ml-2 font-bold text-slate-400">{step === 'AMOUNT_INPUT' ? '원' : ''}</span>
                    </span>
                  </div>
                  <Keypad />
                  <button 
                    disabled={(step === 'ACCOUNT_INPUT' && inputVal.length < 12) || (step === 'AMOUNT_INPUT' && !inputVal)}
                    onClick={() => {
                      if (step === 'ACCOUNT_INPUT') {
                        setInputVal(''); 
                        navigateTo('AMOUNT_INPUT');
                      } else {
                        navigateTo('CONFIRM');
                      }
                    }}
                    className={`w-full max-w-[340px] mt-4 py-5 rounded-2xl text-3xl font-black shadow-lg transition-all ${((step === 'ACCOUNT_INPUT' && inputVal.length < 12) || (step === 'AMOUNT_INPUT' && !inputVal)) ? 'bg-slate-300 text-slate-500' : 'bg-blue-900 text-white active:scale-95'}`}
                  >
                    입력 완료
                  </button>
                </div>
              )}

              {step === 'CONFIRM' && (
                <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 flex flex-col h-full shadow-inner">
                  <h3 className="text-xl font-bold text-slate-400 mb-4 text-center">거래 내용 확인</h3>
                  <div className="space-y-6 text-2xl font-bold">
                    <div className="flex justify-between border-b pb-2">
                      <span className="text-slate-500">종류</span>
                      <span className="text-blue-900">{service === 'TRANSFER' ? '계좌 이체' : service === 'DEPOSIT' ? '현금 입금' : '현금 출금'}</span>
                    </div>
                    {service === 'TRANSFER' && (
                      <div className="flex justify-between border-b pb-2">
                        <span className="text-slate-500">은행</span>
                        <span className="text-slate-800">{targetBank}</span>
                      </div>
                    )}
                    <div className="flex justify-between items-center pt-2">
                      <span className="text-slate-500">금액</span>
                      <span className="text-3xl font-black text-orange-600">{formatAmount(inputVal)} 원</span>
                    </div>
                  </div>
                  <div className="mt-auto flex flex-col gap-3">
                    <button onClick={() => navigateTo('PROCESSING')} className="bg-blue-900 text-white py-6 rounded-2xl text-3xl font-black shadow-lg">네, 맞습니다</button>
                    <button onClick={goBack} className="bg-slate-200 text-slate-700 py-4 rounded-2xl text-xl font-black">아니오 (수정)</button>
                  </div>
                </div>
              )}

              {step === 'PROCESSING' && (
                <div className="h-full flex flex-col items-center justify-center space-y-8">
                  <div className="w-32 h-32 border-[12px] border-slate-100 border-t-blue-900 rounded-full animate-spin"></div>
                  <div className="text-center">
                    <h3 className="text-3xl font-black text-slate-800 mb-2">처리 중입니다</h3>
                    <p className="text-lg text-slate-500 font-bold">잠시만 기다려 주세요.</p>
                  </div>
                </div>
              )}

              {step === 'SUCCESS' && (
                <div className="h-full flex flex-col items-center justify-center space-y-6 animate-in zoom-in duration-500">
                  <div className="bg-emerald-100 p-8 rounded-full text-emerald-600 shadow-lg">
                    <Icon size={100}>✅</Icon>
                  </div>
                  <div className="text-center">
                    <h3 className="text-4xl font-black text-slate-800 mb-2">{service === 'PASSBOOK' ? '완료!' : '성공!'}</h3>
                    <p className="text-xl text-slate-600 font-black break-keep whitespace-pre-line">
                      {service === 'PASSBOOK' ? '통장 정리가 종료되었습니다.' : '현금과 명세표를\n확인해 주세요.'}
                    </p>
                  </div>
                  <button onClick={resetHome} className="bg-blue-900 text-white px-12 py-5 rounded-3xl text-2xl font-black shadow-xl mt-4">
                    메인으로 가기
                  </button>
                </div>
              )}
            </div>

            {step !== 'HOME' && step !== 'SUCCESS' && step !== 'PROCESSING' && step !== 'CASH_COUNT' && step !== 'PASSBOOK_PRINTING' && (
              <div className="bg-white p-4 border-t-2 border-slate-100 flex justify-between gap-3">
                <button onClick={goBack} className="flex-1 flex items-center justify-center gap-2 bg-slate-100 text-slate-600 py-4 rounded-xl text-xl font-black active:bg-slate-200">
                  ← 이전
                </button>
                <button onClick={resetHome} className="flex-1 flex items-center justify-center gap-2 bg-red-50 text-red-600 border-2 border-red-100 py-4 rounded-xl text-xl font-black active:bg-red-100">
                  ✕ 취소
                </button>
              </div>
            )}

            <div className="bg-slate-50 p-2 text-center text-slate-400 font-bold text-[10px] uppercase tracking-wider">
              NH Senior Training Simulator
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
